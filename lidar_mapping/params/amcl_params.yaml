amcl:
  ros__parameters:
    use_sim_time: false
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    global_frame_id: "map"
    tf_broadcast: true
    transform_tolerance: 0.5

    min_particles: 200
    max_particles: 500
    resample_interval: 1

    update_min_d: 0.01
    update_min_a: 0.05

    kld_err: 0.01
    kld_z: 0.99

    laser_model_type: "likelihood_field"
    laser_likelihood_max_dist: 4.0
    max_beams: 45
    z_hit: 0.8
    z_rand: 0.2

    alpha1: 0.05
    alpha2: 0.05
    alpha3: 0.05
    alpha4: 0.05
    alpha5: 0.05

    recovery_alpha_slow: 0.001
    recovery_alpha_fast: 0.1

    scan_topic: scan
